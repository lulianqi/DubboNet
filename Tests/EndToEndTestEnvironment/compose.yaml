# Stable fallback for direct Compose commands only. CI and run-local.sh override
# this with COMPOSE_PROJECT_NAME; use the same -p/name when inspecting or cleaning up.
name: dubbonet-e2e

services:
  zookeeper:
    image: zookeeper:3.8.4
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,mntr,srvr
    ports:
      - "127.0.0.1:2181:2181"

  nacos:
    image: nacos/nacos-server:v2.5.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
